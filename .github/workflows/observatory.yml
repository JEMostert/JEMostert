name: Refresh the observatory

on:
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * *'
  push:
    branches: [main]
    paths:
      - scripts/update_observatory.py
      - .github/workflows/observatory.yml

permissions:
  contents: write

concurrency:
  group: profile-observatory
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'JEMostert/JEMostert'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the profile
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Refresh public project artwork
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/update_observatory.py
      - name: Save changed artwork
        run: |
          git add assets/observatory.svg assets/observatory-compact.svg
          if git diff --cached --quiet; then
            echo 'Public signals are unchanged.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh the public project observatory'
          git push
